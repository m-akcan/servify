# On a version tag (v1.2.3): check that it matches package.json, build and test the package the updater installs
# and create a DRAFT GitHub release with it and its checksum. Nothing is published here and no signing key is used:
# the maintainer runs scripts/publish-release.mjs on their own machine, which rebuilds the tag, compares the result
# with this package, signs a manifest with the release key (which never leaves that machine) and publishes the
# draft. Drafts are invisible to /releases/latest, so no install sees the release before it is signed.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Release signing checks (throwaway key)
        run: node --disable-warning=ExperimentalWarning scripts/test-release-signing.mjs
      - run: pnpm build
      - run: node scripts/release.mjs --out dist
      - name: Self-test of the package
        run: |
          mkdir -p /tmp/pkg && tar -xzf dist/servify-${GITHUB_REF_NAME}.tar.gz -C /tmp/pkg --strip-components=1
          node --disable-warning=ExperimentalWarning /tmp/pkg/server/bin/servify.mjs selftest
      - name: Create the draft release (signed and published by scripts/publish-release.mjs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/servify-${GITHUB_REF_NAME}.tar.gz dist/servify-${GITHUB_REF_NAME}.tar.gz.sha256 --draft --verify-tag --title "Servify ${GITHUB_REF_NAME#v}" --generate-notes
