# Typecheck, build and package on every push and pull request (the Docker acceptance suites still run by hand).
name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Release signing checks (throwaway key)
        run: node --disable-warning=ExperimentalWarning scripts/test-release-signing.mjs
      - run: pnpm build
      - name: Package (as a release would)
        run: node scripts/release.mjs --out dist
      - name: The package starts its self-test
        run: |
          mkdir -p /tmp/pkg && tar -xzf dist/servify-v*.tar.gz -C /tmp/pkg --strip-components=1
          node --disable-warning=ExperimentalWarning /tmp/pkg/server/bin/servify.mjs selftest
